name: Deploy to CapRover

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # the same gate as a local push: format, lint, unit tests, and the
      # whole browser play-through. Never a copy of its steps inlined here —
      # that is how local and CI drift apart.
      - run: npm run verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # checkout leaves the workspace at the git root on a real "main" branch,
      # which is all the CapRover CLI needs: it tars that branch and the server
      # builds the Dockerfile named by captain-definition.
      - name: Deploy to CapRover
        run: |
          npm install -g caprover
          caprover deploy \
            --caproverUrl ${{ secrets.CAPROVER_SERVER }} \
            --appToken ${{ secrets.CAPROVER_APP_TOKEN }} \
            --appName ${{ secrets.CAPROVER_APP }} \
            --branch main
