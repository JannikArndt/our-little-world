# docker compose up -d   ->   http://localhost:8080
services:
  world:
    build: .
    image: our-little-world
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    volumes:
      # the world directory: which worlds exist and how each one was left
      - worlds:/app/data
    restart: unless-stopped

volumes:
  worlds:
