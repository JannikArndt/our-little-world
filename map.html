<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="olw-build" content="dev" />
    <meta
      name="description"
      content="Our Little World, as boxes and arrows: what the players can do, what the villagers can be shown, and what the world does on its own."
    />
    <title>Our Little World — the map</title>
    <link rel="icon" href="icons/app-180.png" />
    <link rel="stylesheet" href="styles/map.css" />
  </head>
  <body>
    <header>
      <h1>
        The map of Our Little World
        <small>built from the code this page came with, so it cannot be a version behind</small>
      </h1>
      <p class="blurb" id="blurb"></p>
      <div class="bar">
        <div class="tabs" id="tabs"></div>
        <input class="find" id="find" type="search" placeholder="find…" aria-label="find a thing" />
        <button class="plain" id="out" aria-label="zoom out">−</button>
        <button class="plain" id="inn" aria-label="zoom in">+</button>
        <button class="plain" id="fit">fit</button>
        <span class="count" id="count"></span>
      </div>
      <p class="legend" id="legend"></p>
    </header>
    <main>
      <svg id="sheet" role="img" aria-label="the game as boxes and arrows"></svg>
      <aside id="panel" hidden aria-live="polite"></aside>
    </main>
    <footer>
      <span id="live"></span> · <a href="/">the game</a> ·
      <a href="/stats">how much it gets played</a>
    </footer>
    <noscript>
      <p style="padding: 16px">
        This page works the game out from its own code, which needs JavaScript. The rulebook in
        CLAUDE.md says the same things in words.
      </p>
    </noscript>
    <script type="module" src="src/map/page.js"></script>
  </body>
</html>
