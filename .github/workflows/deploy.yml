# CapRover, dev in front of prod. Template: app-conventions skill.
#
# push to main       -> verify -> deploy-dev (+ live check) -> deploy-prod (+ live check)
# workflow_dispatch  -> verify -> deploy-dev of the dispatched ref; prod only when that ref is main
#                       (dependabot-merge.yml dispatches main, since a merge made with the
#                       workflow token does not trigger the push event)
# pull request       -> verify only
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # try any branch on dev

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the same gate as a local push: format, lint, unit tests, and the whole
      # browser play-through. Never a copy of its steps inlined here — that is
      # how local and CI drift apart.
      - run: npm run verify

  deploy-dev:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Deploy to CapRover (dev)
        env:
          CAPROVER_URL: https://captain.timpanini.com
          CAPROVER_APP: ${{ secrets.CAPROVER_APP_DEV }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN_DEV }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$CAPROVER_APP" ] || [ -z "$CAPROVER_APP_TOKEN" ]; then
            echo "::error::Set the CAPROVER_APP_DEV and CAPROVER_APP_TOKEN_DEV repository secrets"
            exit 1
          fi
          npx --yes caprover@2.4.4 deploy -u "$CAPROVER_URL" -a "$CAPROVER_APP" -b "$BRANCH" < /dev/null
      # dev catches a CapRover-side failure (a bad image, a crash on boot)
      # before a player sees it; prod does not start until dev serves this build.
      - name: Confirm the new build is live on dev
        env:
          APP_URL: ${{ vars.APP_URL_DEV }}
        run: node tools/live.mjs --wait --url "${APP_URL:-https://ourlittleworld-dev.timpanini.com}"

  deploy-prod:
    needs: deploy-dev
    # The one gate that keeps a manual dispatch of a branch away from prod.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Deploy to CapRover (prod)
        env:
          CAPROVER_URL: https://captain.timpanini.com
          CAPROVER_APP: ${{ secrets.CAPROVER_APP }}
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
        run: |
          if [ -z "$CAPROVER_APP" ] || [ -z "$CAPROVER_APP_TOKEN" ]; then
            echo "::error::Set the CAPROVER_APP and CAPROVER_APP_TOKEN repository secrets"
            exit 1
          fi
          npx --yes caprover@2.4.4 deploy -u "$CAPROVER_URL" -a "$CAPROVER_APP" -b main < /dev/null
      - name: Confirm the new build is live on prod
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: node tools/live.mjs --wait --url "${APP_URL:-https://ourlittleworld.timpanini.com}"
